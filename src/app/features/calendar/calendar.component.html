<app-head [h1]="'Calendrier'"></app-head>
<div class="calendar-container">
  <div class="header-calendar">
    <button
      class="bouton-nav"
      aria-label="Mois précédent"
      mwlCalendarPreviousView
      [(viewDate)]="viewDate"
      [view]="view"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="lucide lucide-chevron-left-icon lucide-chevron-left"
      >
        <path d="m15 18-6-6 6-6" />
      </svg>
    </button>
    <h2>{{ viewDate | calendarDate: "monthViewTitle" : "fr" }}</h2>
    <button
      class="bouton-nav"
      aria-label="Mois suivant"
      mwlCalendarNextView
      [(viewDate)]="viewDate"
      [view]="view"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="lucide lucide-chevron-right-icon lucide-chevron-right"
      >
        <path d="m9 18 6-6-6-6" />
      </svg>
    </button>
  </div>
  <mwl-calendar-month-view
    [viewDate]="viewDate"
    (viewDateChange)="onViewDateChange($event)"
    [events]="events"
    [weekStartsOn]="weekStartsOn"
    (dayClicked)="handleDateClick($event.day.date)"
    (eventClicked)="handleEventClick($event.event)"
  >
  </mwl-calendar-month-view>

  @if (modalVisible) {
    <app-sortie-modal
      [sortie]="selectedSortie"
      [mode]="modalMode"
      (modeChange)="modalMode = $event"
      (close)="modalVisible = false"
      (save)="onSave($event)"
      (delete)="onDelete($event)"
    ></app-sortie-modal>
  }
</div>
<div class="timeline">
  <h3 style="margin-top: 0">Sorties du mois</h3>
  @for (sortie of sortiesDuMois; track sortie) {
    <div class="timeline-item">
      <div class="timeline-date">
        <div class="day">
          {{ sortie.start | date: "d" }}
        </div>
        <div class="month">
          {{ sortie.start | date: "MMM" }}
        </div>
      </div>
      <div class="timeline-line"></div>
      <div class="timeline-dot"></div>
      <div class="timeline-title">
        {{ sortie.title }}
      </div>
    </div>
  }
</div>
<app-menu></app-menu>
