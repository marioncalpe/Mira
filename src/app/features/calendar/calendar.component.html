

<div class="calendar-container">
  <div class="header-calendar">
    <button class="bouton-nav" mwlCalendarPreviousView [(viewDate)]="viewDate" [view]="view"><</button>
    <h2>{{ viewDate | calendarDate:'monthViewTitle':'fr' }}</h2>
    <button class="bouton-nav" mwlCalendarNextView [(viewDate)]="viewDate" [view]="view">></button>
  </div>
  <mwl-calendar-month-view
    [viewDate]="viewDate"
    [events]="events"
    [weekStartsOn]="weekStartsOn"
    (dayClicked)="handleDateClick($event.day.date)"
    (eventClicked)="handleEventClick($event.event)"
  >
  </mwl-calendar-month-view>

  <button class="bouton-ajout" (click)="openCreateModal()">+</button>
  <app-sortie-modal
    *ngIf="modalVisible"
    [sortie]="selectedSortie"
    [mode]="modalMode"
    (close)="modalVisible = false"
    (save)="onSave($event)"
    (delete)="onDelete($event)"
  ></app-sortie-modal>
</div>
<app-menu></app-menu>
