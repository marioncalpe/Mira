<app-head [h1]="'Respiration'"></app-head>

<div class="coherence-page">
  <div class="visual-area">
    <div class="target-ring" aria-hidden="true"></div>
    <div #ball class="ball" aria-hidden="true"></div>
  </div>

  <div #statusText class="status-text" aria-live="polite">Prêt</div>

  <ul class="dots" aria-hidden="true">
    <li
      class="dot"
      *ngFor="let _ of cycles; let i = index"
      [attr.data-index]="i"
    ></li>
  </ul>

  <div class="controls">
    <p class="hint">Choisissez un mode puis démarrez</p>

    <div class="modes">
      <select
        id="mode-select"
        class="mode-select"
        (change)="onModeChange($event)"
        aria-label="Mode de cohérence"
      >
        <option value="classique">Classique (5s / 5s)</option>
        <option value="relaxant">Relaxant (4s / 6s)</option>
        <option value="tonifiant">Tonifiant (4s / 4s)</option>
      </select>
    </div>

    <div class="start-wrap">
      <button
        class="start-btn"
        *ngIf="!isRunning"
        (click)="startExercise()"
        [disabled]="isFinished && false"
      >
        {{ isFinished ? 'Recommencer' : 'Démarrer' }}
      </button>
      <button
        class="start-btn"
        *ngIf="isRunning"
        (click)="togglePlayPause()"
      >
        Pause
      </button>
    </div>
  </div>
</div>

<app-menu></app-menu>
