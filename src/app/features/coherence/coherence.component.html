<app-head [h1]="'Coherence cardiaque'"></app-head>
<div class="coherence-page">
  <div class="visual-area">
    <div #ball class="ball" aria-hidden="true"></div>
  </div>

  <div class="progress-wrap">
    <div #progress class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
    <div #statusText class="phase" aria-live="polite" aria-atomic="true">Inspiration - Cycle 1/6</div>
    <button 
      class="control-button" 
      (click)="isRunning || isFinished ? togglePlayPause() : startExercise()"
      [disabled]="isFinished"
      [attr.aria-label]="'Bouton ' + buttonLabel"
    >
      {{ buttonLabel }}
    </button>
  </div>
</div>

<!-- menu global en bas -->
<app-menu></app-menu>
