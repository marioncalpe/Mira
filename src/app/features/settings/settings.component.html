<app-head [h1]="'Paramètres'"></app-head>
<div class="settings">
  <div class="section">
    <h2>Apparence</h2>
    <div class="theme-toggle">
      <span id="theme-label">{{
        themeActuel === "light" ? "☀️ Thème clair" : "🌙 Thème sombre"
      }}</span>
      <label class="toggle" for="theme-toggle-input">
        <span class="sr-only">Activer le thème sombre</span>
        <input
          id="theme-toggle-input"
          type="checkbox"
          [checked]="themeActuel === 'dark'"
          (change)="basculerTheme()"
        />
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="section">
    <h2>Mes données</h2>
    <button class="btn-save" (click)="exporter()">
      💾 Sauvegarder mes données
    </button>
    <label for="import-file-input" class="sr-only">Importer un fichier de sauvegarde</label>
    <input
      id="import-file-input"
      type="file"
      accept=".json"
      #importInput
      style="display: none"
      (change)="importer($event)"
    />
    <button class="btn-import" (click)="importInput.click()">
      📂 Importer mes données
    </button>
    <button class="btn-delete" (click)="effacer()">
      🗑️ Effacer toutes mes données
    </button>
  </div>

  <div class="section">
    <h2>Profil</h2>
    <label for="prenom-input" class="sr-only">Ton prénom</label>
    <input
      id="prenom-input"
      type="text"
      [(ngModel)]="prenom"
      (blur)="sauvegarderPrenom()"
      placeholder="Ton prénom (optionnel)"
      class="input-prenom"
    />
  </div>
  <div class="section">
    <h2>Aide</h2>
    <button class="btn-import" routerLink="/apropos">
      ℹ️ À propos de Mira
    </button>
  </div>
</div>
<app-menu></app-menu>
