      <!-- Description libre de la sortie -->
      <div class="form-group">
        <!-- <label for="textarea" class="description-label">Description</label> -->
        <textarea
          [(ngModel)]="temp.extendedProps.sentiment"
          id="textarea"
          rows="10"
          cols="50"
          placeholder="Description"
        >
        </textarea>
      </div>

      <!-- Actions disponibles en mode édition -->
      <div class="actions">
        <!-- Au lieu de (click)="onDelete()", on passe en mode suppr -->
        <button
          class="delete"
          *ngIf="sortie"
          (click)="modeChange.emit('suppr')"
        >
          Supprimer
        </button>
        <button class="save" (click)="onSave()">Valider</button>
      </div>
    </div>
  </div>
}
@if(mode === "suppr") {
  <div class="view-mode">
    <div class="modal">
      <h2>Supprimer cette sortie ?</h2>
      <p>Cette action est irréversible.</p>
      <div class="actions">
        <button class="delete" (click)="onDelete()">Confirmer</button>
        <button class="close" (click)="onClose()">Annuler</button>
      </div>
    </div>
  </div>
}
