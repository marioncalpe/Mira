      /* Style pour la splash screen */
      #splash-screen {
        position: fixed;

        width: 100%;
        height: 100%;
        background-image: linear-gradient(
          180deg,
          #ff4d6d 0%,
          rgba(30, 20, 40, 1) 100%
        );
        display: flex;
        flex-direction: column;
        justify-content: space-around;
        align-items: center;
        z-index: 9999;
      }

      .splash-logo {
        width: 512px;
        height: 512px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .splash-logo img {
        width: 60%;
        height: 60%;
        object-fit: contain;
      }

      .splash-text {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        margin-top: 20px;
        color: white;
        font-family: "Poppins", sans-serif;

        h1{
          font-size: 2.5em;
          margin: 0;
        }
        p{
          display: flex;
          justify-content: center;
          align-items: center;
          text-align: center;
          font-size: 1em;
          margin: 1em;
        }
      }
